# PlexMind release line: v0.8.20
services:
  docker-broker:
    build:
      context: ./scripts
      dockerfile: Dockerfile.broker
    image: plexmind-docker-broker:0.8.20
    restart: unless-stopped
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PLEXMIND_BROKER_TOKEN=${PLEXMIND_BROKER_TOKEN}
      - PLEXMIND_ALLOWED_CONTAINERS=${WHISPER_CONTAINER_NAME:-whisper-asr-webservice},${LLAMA_CPP_CONTAINER_NAME:-llama-cpp}
  # ---------------------------------------------------------------------------
  # llama.cpp — Local LLM server (recommendations + translation)
  # ---------------------------------------------------------------------------
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp@sha256:a50b12bb92de0253d2737824ca1887f410e07b4dd3e3028f74a5a0a67c789e4b
    container_name: llama-cpp
    restart: unless-stopped
    ports:
      - "${LLAMA_CPP_HOST_PORT:-11435}:8080"
    volumes:
      - ${LLAMA_CPP_MODEL_PATH:-/mnt/cache/appdata/llama-cpp/models/Qwen3.5-9B-Q5_K_M.gguf}:/models/model.gguf:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/model.gguf
      - --alias
      - ${LLAMA_CPP_MODEL_ALIAS:-qwen3.5-9b-q5_k_m}
      - --ctx-size
      - ${LLAMA_CPP_CTX_SIZE:-8192}
      - --n-gpu-layers
      - ${LLAMA_CPP_N_GPU_LAYERS:-99}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  # ---------------------------------------------------------------------------
  # Whisper ASR — Speech-to-text transcription
  # ---------------------------------------------------------------------------
  whisper:
    image: ${WHISPER_IMAGE:-onerahmet/openai-whisper-asr-webservice@sha256:3deb30cfd3d5614fd3885e6dfbef7dfcf95fe897300ecc703f7f3b3682b717ae}
    container_name: whisper-asr-webservice
    restart: "no"
    mem_limit: ${WHISPER_MEM_LIMIT:-12g}
    ports:
      - "${WHISPER_HOST_PORT:-9001}:9000"
    volumes:
      - ${WHISPER_CACHE_DIR:-./data/whisper-cache}:/root/.cache/whisper
      - "${WHISPER_TMP_DIR:-/tmp}:/tmp"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-turbo}
      - ASR_DEVICE=${WHISPER_DEVICE:-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Whisper is created by compose but controlled by PlexMind scripts.
    profiles: ["whisper"]

  # ---------------------------------------------------------------------------
  # PlexMind — AI recommendation engine (FastAPI)
  # ---------------------------------------------------------------------------
  plexmind:
    build:
      context: .
      dockerfile: plexmind/Dockerfile
    image: plexmind:0.8.20
    container_name: plexmind
    restart: unless-stopped
    ports:
      - "8000:8000"
    labels:
      net.unraid.docker.managed: "dockerman"
      net.unraid.docker.webui: "http://[IP]:[PORT:8000]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/FineChAInesium/PlexMind/main/templates/icon.png"
    volumes:
      - ./data:/app/data
      - "${WHISPER_CACHE_DIR:-./data/whisper-cache}:/whisper-cache:ro"
    environment:
      - DATA_DIR=/app/data
      - PLEX_URL=${PLEX_URL:-http://host.docker.internal:32400}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEXMIND_API_KEY=${PLEXMIND_API_KEY:-}
      - PLEXMIND_WEBHOOK_SECRET=${PLEXMIND_WEBHOOK_SECRET}
      - PLEXMIND_CONTROL_TOKEN=${PLEXMIND_CONTROL_TOKEN}
      - DOCKER_BROKER_URL=http://docker-broker:9020
      - PLEXMIND_BROKER_TOKEN=${PLEXMIND_BROKER_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080}
      - LLAMA_CPP_MODEL=${LLAMA_CPP_MODEL_ALIAS:-qwen3.5-9b-q5_k_m}
      - LLAMA_CPP_MAX_TOKENS=${LLAMA_CPP_MAX_TOKENS:-768}
      - MAX_RECOMMENDATIONS=${MAX_RECOMMENDATIONS:-10}
      - CANDIDATE_POOL_SIZE=${CANDIDATE_POOL_SIZE:-40}
      - ENRICH_PROVIDER_TIMEOUT_SECONDS=${ENRICH_PROVIDER_TIMEOUT_SECONDS:-45}
      - MIN_HISTORY_ITEMS=${MIN_HISTORY_ITEMS:-3}
      - SUPPRESSION_DAYS=${SUPPRESSION_DAYS:-60}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - GPU_THRESHOLD_PCT=${GPU_THRESHOLD_PCT:-30}
      - GPU_BACKOFF_MINUTES=${GPU_BACKOFF_MINUTES:-30}
      - FEEDBACK_FILE=/app/data/feedback.json
      - SHOWN_RECS_FILE=/app/data/shown_recs.json
      - WATCHLIST_TRACK_FILE=/app/data/watchlist_track.json
      - REC_HISTORY_FILE=/app/data/recommendation_history.json
      - PLEXMIND_SCRIPT_MODE=${PLEXMIND_SCRIPT_MODE:-remote}
      - SCRIPTS_API_URL=${SCRIPTS_API_URL:-http://scripts:9010}
      - SCRIPT_START_RATE_LIMIT=${SCRIPT_START_RATE_LIMIT:-60/hour}
      - WHISPER_API_URL=${WHISPER_API_URL:-http://whisper:9000/asr}
      - WHISPER_HOST_PORT=${WHISPER_HOST_PORT:-9001}
      - WHISPER_CONTAINER_NAME=${WHISPER_CONTAINER_NAME:-whisper-asr-webservice}
      - WHISPER_MODEL=${WHISPER_MODEL:-turbo}
      - WHISPER_MODEL_CACHE_DIR=/whisper-cache
      - START_SIDECAR_CONTAINERS=${START_SIDECAR_CONTAINERS:-1}
      - STOP_SIDECAR_CONTAINERS=${STOP_SIDECAR_CONTAINERS:-1}
      - TRANSCRIBE_AUDIO_EXT=${TRANSCRIBE_AUDIO_EXT:-mp3}
      - TRANSCRIBE_AUDIO_CODEC=${TRANSCRIBE_AUDIO_CODEC:-libmp3lame}
      - TRANSCRIBE_AUDIO_BITRATE=${TRANSCRIBE_AUDIO_BITRATE:-64k}
      - WHISPER_UPLOAD_SPLIT_MB=${WHISPER_UPLOAD_SPLIT_MB:-50}
      - WHISPER_SEGMENT_SECONDS=${WHISPER_SEGMENT_SECONDS:-600}
      - SUBTITLE_MAX_LINE_CHARS=${SUBTITLE_MAX_LINE_CHARS:-42}
      - SUBTITLE_MAX_LINES=${SUBTITLE_MAX_LINES:-2}
      - SUBTITLE_MAX_CPS=${SUBTITLE_MAX_CPS:-20}
      - SUBTITLE_MIN_CUE_SECONDS=${SUBTITLE_MIN_CUE_SECONDS:-1.0}
      - SUBTITLE_MAX_CUE_SECONDS=${SUBTITLE_MAX_CUE_SECONDS:-7.0}
      - SUBTITLE_MIN_GAP_SECONDS=${SUBTITLE_MIN_GAP_SECONDS:-0.04}
      - LLAMA_CPP_API_URL=${LLAMA_CPP_API_URL:-}
      - LLAMA_CPP_CONTAINER_NAME=${LLAMA_CPP_CONTAINER_NAME:-llama-cpp}
      - MANAGE_LLAMA_CPP_CONTAINER=${MANAGE_LLAMA_CPP_CONTAINER:-0}
      - MOVIE_DIR=/media/movies
      - MOVIES_DIR=/media/movies
      - TV_DIR=/media/tv
      - DATA_DIR=/app/data
      - STORAGE_PATH=/media/movies
      - ALLOW_EMPTY_MEDIA_ROOTS=${ALLOW_EMPTY_MEDIA_ROOTS:-0}
      - TARGET_LANGUAGES=${TARGET_LANGUAGES:-zh,es-MX}
      - TRANSCRIBE_START_HOUR=${TRANSCRIBE_START_HOUR:-5}
      - TRANSCRIBE_END_HOUR=${TRANSCRIBE_END_HOUR:-12}
      - TRANSLATE_START_HOUR=${TRANSLATE_START_HOUR:-23}
      - TRANSLATE_END_HOUR=${TRANSLATE_END_HOUR:-3}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - TZ=${TZ:-UTC}
    depends_on:
      - llama-cpp
      - scripts
      - recommendation-worker

  recommendation-worker:
    build:
      context: .
      dockerfile: plexmind/Dockerfile
    image: plexmind:0.8.20
    restart: unless-stopped
    stop_grace_period: 6h
    command: ["python", "-m", "app.recommendation_worker"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PLEX_URL=${PLEX_URL:-http://host.docker.internal:32400}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080}
      - LLAMA_CPP_MODEL=${LLAMA_CPP_MODEL_ALIAS:-qwen3.5-9b-q5_k_m}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TVDB_API_KEY=${TVDB_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - FEEDBACK_FILE=/app/data/feedback.json
      - SHOWN_RECS_FILE=/app/data/shown_recs.json
      - WATCHLIST_TRACK_FILE=/app/data/watchlist_track.json
      - REC_HISTORY_FILE=/app/data/recommendation_history.json
      - DOCKER_BROKER_URL=http://docker-broker:9020
      - PLEXMIND_BROKER_TOKEN=${PLEXMIND_BROKER_TOKEN}
      - GPU_THRESHOLD_PCT=${GPU_THRESHOLD_PCT:-30}
      - GPU_BACKOFF_MINUTES=${GPU_BACKOFF_MINUTES:-30}
      - TZ=${TZ:-UTC}
    depends_on:
      - llama-cpp
      - docker-broker

  # ---------------------------------------------------------------------------
  # Scripts — Transcription, translation, maintenance pipeline
  # ---------------------------------------------------------------------------
  scripts:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    image: plexmind-scripts:0.8.20
    container_name: plexmind-scripts
    restart: unless-stopped
    volumes:
      - "${MOVIES_HOST_PATH:-${MOVIES_DIR:-/mnt/data/media/Movies}}:/media/movies"
      - "${TV_HOST_PATH:-${TV_DIR:-/mnt/data/media/TV Shows}}:/media/tv"
      - ./data:/app/data
    environment:
      - WHISPER_API_URL=${WHISPER_API_URL:-http://whisper:9000/asr}
      - WHISPER_HOST_PORT=${WHISPER_HOST_PORT:-9001}
      - WHISPER_CONTAINER_NAME=${WHISPER_CONTAINER_NAME:-whisper-asr-webservice}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080}
      - LLAMA_CPP_API_URL=${LLAMA_CPP_API_URL:-}
      - LLAMA_CPP_CONTAINER_NAME=${LLAMA_CPP_CONTAINER_NAME:-llama-cpp}
      - MANAGE_LLAMA_CPP_CONTAINER=${MANAGE_LLAMA_CPP_CONTAINER:-0}
      - LLAMA_CPP_MODEL=${LLAMA_CPP_MODEL_ALIAS:-qwen3.5-9b-q5_k_m}
      - LLAMA_CPP_MAX_TOKENS=${LLAMA_CPP_MAX_TOKENS:-768}
      - SCRIPTS_API_URL=${SCRIPTS_API_URL:-http://scripts:9010}
      - CHUNK_RETRY_ATTEMPTS=${CHUNK_RETRY_ATTEMPTS:-3}
      - CHUNK_RETRY_DELAY_SECONDS=${CHUNK_RETRY_DELAY_SECONDS:-2}
      - FAILED_RETRY_HOURS=${FAILED_RETRY_HOURS:-24}
      - WHISPER_MODEL=${WHISPER_MODEL:-turbo}
      - TRANSCRIBE_AUDIO_EXT=${TRANSCRIBE_AUDIO_EXT:-mp3}
      - TRANSCRIBE_AUDIO_CODEC=${TRANSCRIBE_AUDIO_CODEC:-libmp3lame}
      - TRANSCRIBE_AUDIO_BITRATE=${TRANSCRIBE_AUDIO_BITRATE:-64k}
      - WHISPER_UPLOAD_SPLIT_MB=${WHISPER_UPLOAD_SPLIT_MB:-50}
      - WHISPER_SEGMENT_SECONDS=${WHISPER_SEGMENT_SECONDS:-600}
      - SUBTITLE_MAX_LINE_CHARS=${SUBTITLE_MAX_LINE_CHARS:-42}
      - SUBTITLE_MAX_LINES=${SUBTITLE_MAX_LINES:-2}
      - SUBTITLE_MAX_CPS=${SUBTITLE_MAX_CPS:-20}
      - SUBTITLE_MIN_CUE_SECONDS=${SUBTITLE_MIN_CUE_SECONDS:-1.0}
      - SUBTITLE_MAX_CUE_SECONDS=${SUBTITLE_MAX_CUE_SECONDS:-7.0}
      - SUBTITLE_MIN_GAP_SECONDS=${SUBTITLE_MIN_GAP_SECONDS:-0.04}
      - MOVIE_DIR=/media/movies
      - MOVIES_DIR=/media/movies
      - TV_DIR=/media/tv
      - ALLOW_EMPTY_MEDIA_ROOTS=${ALLOW_EMPTY_MEDIA_ROOTS:-0}
      - START_SIDECAR_CONTAINERS=${START_SIDECAR_CONTAINERS:-1}
      - STOP_SIDECAR_CONTAINERS=${STOP_SIDECAR_CONTAINERS:-1}
      - TARGET_LANGUAGES=${TARGET_LANGUAGES:-zh,es-MX}
      - KNOWN_BILINGUAL_TITLES=${KNOWN_BILINGUAL_TITLES:-90 Day Fiancé,Shogun,Shōgun,Squid Game}
      - KNOWN_ENGLISH_REALITY_TITLES=${KNOWN_ENGLISH_REALITY_TITLES:-Summer House,Vanderpump Rules}
      - ENABLE_WATERMARK=${ENABLE_WATERMARK:-true}
      - WATERMARK_TEXT=${WATERMARK_TEXT:-Brought to you by PlexMind}
      - WATERMARK_SEARCH=${WATERMARK_SEARCH:-PlexMind}
      - SUBTITLE_FILE_MODE=${SUBTITLE_FILE_MODE:-0644}
      - SUBTITLE_UID=${SUBTITLE_UID:-}
      - SUBTITLE_GID=${SUBTITLE_GID:-}
      - PGS_CLEANUP_ALLOW_UNKNOWN=${PGS_CLEANUP_ALLOW_UNKNOWN:-0}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - MAX_RUNTIME_MINUTES=${MAX_RUNTIME_MINUTES:-0}
      - SCRIPTS_API_PORT=${SCRIPTS_API_PORT:-9010}
      - PLEXMIND_CONTROL_TOKEN=${PLEXMIND_CONTROL_TOKEN}
      - DOCKER_BROKER_URL=http://docker-broker:9020
      - PLEXMIND_BROKER_TOKEN=${PLEXMIND_BROKER_TOKEN}
      - GPU_THRESHOLD_PCT=${GPU_THRESHOLD_PCT:-30}
      - TZ=${TZ:-UTC}
    depends_on:
      - llama-cpp
      - docker-broker

  # ---------------------------------------------------------------------------
  # FFmpeg — GPU-accelerated media processing
  # ---------------------------------------------------------------------------
  ffmpeg:
    image: linuxserver/ffmpeg@sha256:771895205f3a62023f14e5ca1fe94be8007ecaf8a7c268d9c502de260c213d22
    container_name: plexmind-ffmpeg
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    volumes:
      - "${MOVIES_HOST_PATH:-${MOVIES_DIR:-/mnt/data/media/Movies}}:/media/movies"
      - "${TV_HOST_PATH:-${TV_DIR:-/mnt/data/media/TV Shows}}:/media/tv"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["tools"]
